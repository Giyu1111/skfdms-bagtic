<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Logs</title>
  <link rel="stylesheet" href="../../css/style.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{display:flex;flex-direction:column;min-height:100vh;background:#F0F4F8;font-family:'DM Sans',system-ui,sans-serif;}
    .admin-layout{display:flex;flex:1;}
    .sidebar{width:252px;background:#1A4530;flex-shrink:0;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;}
    .sidebar-logo{padding:24px 22px;border-bottom:1px solid rgba(255,255,255,.1);}
    .sidebar-logo .sk-badge{font-size:1.55rem;font-weight:800;color:#D4AC0D;letter-spacing:2px;}
    .sidebar-logo p{font-size:.84rem;color:rgba(255,255,255,.62);margin-top:6px;}
    .sidebar-nav{padding:12px 0;flex:1;}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:13px 22px;color:rgba(255,255,255,.78);font-size:1rem;font-weight:600;text-decoration:none;transition:all .18s;border-left:3px solid transparent;}
    .sidebar-nav a:hover{background:rgba(255,255,255,.08);color:#fff;}
    .sidebar-nav a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#D4AC0D;}
    .nav-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;min-width:22px;flex-shrink:0;font-size:1rem;line-height:1;color:transparent;position:relative;overflow:hidden;}
    .nav-icon::before{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;}
    .sidebar-user{padding:16px 22px;border-top:1px solid rgba(255,255,255,.1);}
    .sidebar-user .uname{font-weight:700;font-size:.96rem;color:#fff;}
    .sidebar-user .urole{font-size:.8rem;color:rgba(255,255,255,.5);text-transform:capitalize;margin-top:4px;}
    .admin-main{flex:1;overflow-y:auto;}
    .topbar{background:#fff;padding:0 30px;height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;box-shadow:0 1px 3px rgba(0,0,0,.05);position:sticky;top:0;z-index:50;}
    .topbar-left { display: flex; align-items: center; gap: 15px; }
    .topbar-left h2{font-size:1.2rem;color:#1A4530;font-weight:800;}
    .barangay-select { padding: 9px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: .95rem; font-weight: 600; color: #1A4530; background-color: #F8FBFE; outline: none; }
    .content{padding:28px;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:.92rem;font-weight:600;border:none;cursor:pointer;text-decoration:none;transition:all .18s;font-family:inherit;}
    .btn-secondary{background:#f0f0f0;color:#444;} .btn-secondary:hover{background:#ddd;}
    .btn-sm{padding:6px 12px;font-size:.82rem;}
    .btn-logout{background:#f0f0f0;color:#555;border:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;}
    .card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid #eee;overflow:hidden;}
    .card-header{padding:14px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
    .card-header h3{font-size:1rem;color:#1A4530;font-weight:800;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    thead tr{background:#1A4530;}
    thead th{color:#fff;font-size:.82rem;font-weight:700;padding:11px 14px;text-align:left;white-space:nowrap;}
    tbody tr{border-bottom:1px solid #f2f2f2;transition:background .15s;}
    tbody tr:hover{background:#f8fbfe;}
    tbody td{padding:11px 14px;font-size:.9rem;color:#444;vertical-align:middle;}
    .action-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.74rem;font-weight:800;font-family:monospace;letter-spacing:.3px;}
    .chip-upload{background:#D5F5E3;color:#1E8449;}
    .chip-publish{background:#D5F5E3;color:#1A4530;}
    .chip-delete{background:#FADBD8;color:#C0392B;}
    .chip-login{background:#FEF9E7;color:#B7950B;}
    .chip-logout{background:#F4ECF7;color:#7D3C98;}
    .chip-user{background:#EBF0F4;color:#555;}
    .chip-ann{background:#FDF2E9;color:#CA6F1E;}
    .chip-default{background:#f0f0f0;color:#666;}
    .empty{text-align:center;padding:50px;color:#bbb;}
    .count-badge{background:#D6F0E6;color:#1A4530;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:20px;}
    .filter-row{padding:14px 22px;border-bottom:1px solid #f5f5f5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fafafa;}
    .filter-row select{padding:9px 11px;border:1.5px solid #ddd;border-radius:8px;font-size:.9rem;outline:none;font-family:inherit;}
    .filter-row select:focus{border-color:#3D8C62;}
  </style>
  <link rel="stylesheet" href="../../css/admin-shell.css"/>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <script src="../../js/public-theme.js" defer></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="admin-brand">
        <span class="admin-brand-logos" aria-hidden="true">
          <img class="admin-brand-logo" src="../../images/cLogo.jpg" alt="" />
          <img class="admin-brand-logo" src="../../images/favicon.png" alt="" />
        </span>
        <span class="admin-brand-title">
          <span class="admin-brand-kabataan">Sangguniang Kabataan</span>
          <span class="admin-brand-rule"></span>
          <span class="admin-brand-text">MUNICIPALITY OF CATIGBIAN</span>
        </span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a href="dashboard.html" data-role="chairperson,admin"><span class="nav-icon" aria-hidden="true"></span><span>Dashboard</span></a>
      <a href="documents.html" data-role="chairperson,admin,treasurer,secretary,councilor"><span class="nav-icon" aria-hidden="true"></span><span>Documents</span></a>
      <a href="upload.html" data-role="chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Upload</span></a>
      <a href="transparency.html" data-role="chairperson,admin,treasurer,secretary,councilor"><span class="nav-icon" aria-hidden="true"></span><span>Fund Proofs</span></a>
      <a href="announcements.html" data-role="chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Announcements</span></a>
      <a href="users.html" data-role="admin"><span class="nav-icon" aria-hidden="true"></span><span>Users</span></a>
      <a href="activity-log.html" class="active" data-role="admin,chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Activity Log</span></a>
      <a href="/" class="sidebar-public-link" style="margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;"><span class="nav-icon" aria-hidden="true"></span><span>Public Site</span></a>
    </nav>
    <div class="sidebar-user"><div class="uname" id="sName">...</div><div class="urole" id="sRole"></div></div>
  </aside>

  <div class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Activity Log</h2>
        <select id="barangaySelector" class="barangay-select"></select>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-secondary btn-sm" onclick="loadLogs()">Refresh</button>
        <button class="btn-logout" onclick="doLogout()">Log Out</button>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <h3 id="logTitle">All Admin Actions</h3>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="count-badge" id="logCount">0 entries</span>
          </div>
        </div>

        <div class="filter-row">
          <div>
            <select id="fAction" onchange="applyFilter()">
              <option value="">All Actions</option>
              <option value="LOGIN">Login</option>
              <option value="LOGOUT">Logout</option>
              <option value="UPLOAD">Upload</option>
              <option value="PUBLISH">Publish</option>
              <option value="DELETE">Delete</option>
              <option value="USER">User</option>
              <option value="ANNOUNCEMENT">Announcement</option>
            </select>
          </div>
          <span style="font-size:.82rem;color:#aaa;" id="filterInfo"></span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Action</th>
                <th>User</th>
                <th>Role</th>
                <th>Details</th>
                <th>IP Address</th>
                <th>Date & Time</th>
              </tr>
            </thead>
            <tbody id="logBody">
              <tr><td colspan="7"><div class="empty">Loading...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/barangay-context.js"></script>
<script>
  var API = window.location.origin + '/api';
  var allLogs = [];
  var currentUser = null;

  function fmtTs(d){
    if(!d)return'-';
    return new Date(d).toLocaleString('en-PH',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  }

  function chipClass(action){
    if(!action)return'chip-default';
    if(action.includes('UPLOAD'))return'chip-upload';
    if(action.includes('PUBLISH'))return'chip-publish';
    if(action.includes('DELETE'))return'chip-delete';
    if(action.includes('LOGIN')&&!action.includes('LOGOUT'))return'chip-login';
    if(action.includes('LOGOUT'))return'chip-logout';
    if(action.includes('USER'))return'chip-user';
    if(action.includes('ANNOUNCE'))return'chip-ann';
    return'chip-default';
  }

  function renderLogs(logs){
    var tbody=document.getElementById('logBody');
    document.getElementById('logCount').textContent=logs.length+' entries';
    if(!logs.length){
      tbody.innerHTML='<tr><td colspan="7"><div class="empty">No activity logs found.</div></td></tr>';
      return;
    }
    tbody.innerHTML=logs.map(function(l,i){
      return '<tr>'
        +'<td style="color:#ccc;">'+(i+1)+'</td>'
        +'<td><span class="action-chip '+chipClass(l.action)+'">'+l.action+'</span></td>'
        +'<td><strong>'+(l.user_name||'System')+'</strong></td>'
        +'<td style="text-transform:capitalize;color:#888;">'+(l.role||'-')+'</td>'
        +'<td style="max-width:280px;font-size:.84rem;color:#666;">'+(l.details||'-')+'</td>'
        +'<td style="font-size:.82rem;color:#aaa;font-family:monospace;">'+(l.ip_address||'-')+'</td>'
        +'<td style="font-size:.84rem;white-space:nowrap;">'+fmtTs(l.created_at)+'</td>'
      +'</tr>';
    }).join('');
  }

  function applyFilter(){
    var f=document.getElementById('fAction').value;
    if(!f){ renderLogs(allLogs); document.getElementById('filterInfo').textContent=''; return; }
    var filtered=allLogs.filter(function(l){ return l.action&&l.action.includes(f); });
    renderLogs(filtered);
    document.getElementById('filterInfo').textContent='Showing '+filtered.length+' of '+allLogs.length+' entries';
  }

  async function loadLogs(){
    var sel = document.getElementById('barangaySelector').value;
    var qs = '';
    if (currentUser && currentUser.role === 'admin') {
      // If "All Barangays" is selected (value = 'all'), send barangay_id=all
      if (sel === 'all') {
        qs = '?barangay_id=all';
      } else {
        qs = '?barangay_id=' + sel;
      }
    }
    var r=await fetch(API+'/admin/activity-logs'+qs,{credentials:'include'});
    var d=await r.json();
    if(!d.success){ document.getElementById('logBody').innerHTML='<tr><td colspan="7"><div class="empty">Failed to load logs.</div></td></tr>'; return; }
    allLogs=d.data;
    renderLogs(allLogs);
  }

  window.addEventListener('load', async function(){
    var r=await fetch(API+'/auth/me',{credentials:'include'});
    var d=await r.json();
    if(!d.success){window.location.href='/pages/login';return;}
    currentUser = d.user;

    // SK Federated admin sees all barangays; SK chairpersons see their own barangay only.
    if (!['admin', 'chairperson'].includes(currentUser.role)) {
      alert('Access denied. This page is for SK Federated and SK Chairperson accounts only.');
      window.location.href = 'dashboard';
      return;
    }

    document.getElementById('sName').textContent=d.user.name;
    document.getElementById('sRole').textContent=d.user.role;
    document.getElementById('logTitle').textContent = currentUser.role === 'admin'
      ? 'All Admin Actions'
      : 'Barangay Admin Actions';

    await window.SkBarangay.init(currentUser);
    
    // Populate dropdown with "All Barangays" option for admin
    var sel = document.getElementById('barangaySelector');
    if (currentUser.role === 'admin') {
      // Add "All Barangays" at the top
      sel.innerHTML = '<option value="all">All Barangays</option>';
      // Then add the rest from SkBarangay (re-populate after init)
      // Note: SkBarangay.populateDropdown normally replaces everything,
      // so we'll customize after calling it.
      window.SkBarangay.populateDropdown(sel);
      // Prepend the "All" option at the top
      var allOption = document.createElement('option');
      allOption.value = 'all';
      allOption.textContent = 'All Barangays';
      sel.insertBefore(allOption, sel.firstChild);
      sel.value = 'all'; // default to all
      window.SkBarangay.setSelectedBarangayId('all');
      window.SkBarangay.updateSidebarCaption();
    } else {
      // non-admin: no all option
      window.SkBarangay.populateDropdown(sel);
    }

    sel.addEventListener('change', function() {
      if (currentUser.role === 'admin') {
        if (this.value === 'all') {
          window.SkBarangay.setSelectedBarangayId('all');
        } else {
          window.SkBarangay.setSelectedBarangayId(this.value);
        }
      }
      loadLogs();
    });

    applyRoleVisibility();
    loadLogs();
  });

  async function doLogout(){
    if(!confirm('Are you sure you want to log out?'))return;
    await fetch(API+'/auth/logout',{method:'POST',credentials:'include'});
    window.location.href='/';
  }

  function applyRoleVisibility() {
    var role = currentUser?.role;
    if (!role) return;
    var links = document.querySelectorAll('#sidebarNav a[data-role]');
    links.forEach(function(link) {
      var allowed = link.getAttribute('data-role').split(',');
      if (!allowed.includes(role)) {
        link.style.display = 'none';
      }
    });
    updateSidebarLinks(role);
  }
  function updateSidebarLinks(role) {
    var links = document.querySelectorAll('#sidebarNav a[data-role]');
    links.forEach(function(link) {
      var span = link.querySelector('span:last-child');
      if (!span) return;
      var href = link.getAttribute('href');
      if (role === 'chairperson') {
        if (href === 'upload.html') link.style.display = 'none';
        if (href === 'documents.html') span.textContent = 'My Documents';
        if (href === 'transparency.html') span.textContent = 'My Accomplishments';
        if (href === 'announcements.html') span.textContent = 'Post Announcements';
      } else if (role === 'admin') {
        if (href === 'documents.html') span.textContent = 'Manage Documents';
        if (href === 'transparency.html') span.textContent = 'Manage Accomplishments';
        if (href === 'upload.html') link.style.display = 'none';
      }
    });
  }
</script>
</body>
</html>
