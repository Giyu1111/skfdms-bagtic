<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Password | SK-FDMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(5,18,11,.72),rgba(5,18,11,.78)),url('../images/bg_catigbian.jpg') center/cover fixed;color:#143225;font-family:'DM Sans',system-ui,sans-serif}
    main{width:min(100%,440px);padding:32px;border-radius:18px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.6);box-shadow:0 24px 70px rgba(0,0,0,.26);backdrop-filter:blur(14px)}
    h1{margin:0;color:#1A4530;font-size:1.5rem}p{line-height:1.55;color:#52665A}.field{margin-top:16px}.field label{display:block;margin-bottom:6px;font-size:.82rem;font-weight:800;color:#33443A}.field input{width:100%;padding:12px;border:1px solid #BFD5C6;border-radius:9px;font:inherit;box-sizing:border-box}.field input:focus{outline:0;border-color:#3D8C62;box-shadow:0 0 0 3px rgba(61,140,98,.14)}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#1A4530;color:#fff;font:800 1rem inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.alert{margin-top:16px;padding:11px 13px;border-radius:8px;font-size:.88rem}.error{background:#FDECEC;color:#A92B22}.success{background:#E1F5E8;color:#17663B}a{color:#1A6D43;font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>Create your password</h1>
    <p id="intro">Checking your secure setup link…</p>
    <form id="passwordForm" hidden>
      <div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button id="submitButton" type="submit">Create Password</button>
    </form>
    <div id="alert" role="alert"></div>
  </main>
  <script>
    (function(){
      var token=new URLSearchParams(window.location.search).get('token');
      var intro=document.getElementById('intro'), form=document.getElementById('passwordForm'), alertBox=document.getElementById('alert');
      function alert(message,type){alertBox.innerHTML='<div class="alert '+type+'">'+message+'</div>';}
      if(!token){intro.textContent='This password setup link is missing or invalid.';alert('Request a new setup link from SK Federated Admin.','error');return;}
      fetch('/api/auth/password-setup/validate?token='+encodeURIComponent(token)).then(function(r){return r.json().then(function(data){return {ok:r.ok,data:data};});}).then(function(result){
        if(!result.ok||!result.data.success){intro.textContent='This password setup link cannot be used.';alert(result.data.message||'Request a new setup link from SK Federated Admin.','error');return;}
        intro.textContent='Welcome, '+result.data.name+'. Choose a password with at least 8 characters.';form.hidden=false;
      }).catch(function(){intro.textContent='Unable to check this link.';alert('Please try again later.','error');});
      form.addEventListener('submit',function(event){event.preventDefault();var password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value,button=document.getElementById('submitButton');if(password!==confirm){alert('Passwords do not match.','error');return;}button.disabled=true;button.textContent='Creating password…';fetch('/api/auth/password-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:password})}).then(function(r){return r.json().then(function(data){return {ok:r.ok,data:data};});}).then(function(result){if(!result.ok||!result.data.success){alert(result.data.message||'Unable to create password.','error');button.disabled=false;button.textContent='Create Password';return;}form.hidden=true;intro.textContent='Your account is ready.';alert('Password created successfully. <a href="/pages/login">Sign in now</a>.','success');}).catch(function(){alert('Unable to create password. Please try again.','error');button.disabled=false;button.textContent='Create Password';});});
    })();
  </script>
</body>
</html>
