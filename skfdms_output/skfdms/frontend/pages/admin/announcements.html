<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Announcements</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="../../css/style.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{display:flex;flex-direction:column;min-height:100vh;background:#F0F4F8;font-family:'DM Sans',system-ui,sans-serif;}
    .admin-layout{display:flex;flex:1;}
    .sidebar{width:252px;background:#1A4530;flex-shrink:0;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;}
    .sidebar-logo{padding:24px 22px;border-bottom:1px solid rgba(255,255,255,.1);}
    .sidebar-logo .sk-badge{font-size:1.55rem;font-weight:800;color:#D4AC0D;letter-spacing:2px;}
    .sidebar-logo p{font-size:.84rem;color:rgba(255,255,255,.62);margin-top:6px;}
    .sidebar-nav{padding:12px 0;flex:1;}
    .sidebar-nav a{display:flex;align-items:center;gap:12px;padding:13px 22px;color:rgba(255,255,255,.78);font-size:1rem;font-weight:600;text-decoration:none;transition:all .18s;border-left:3px solid transparent;}
    .sidebar-nav a:hover{background:rgba(255,255,255,.08);color:#fff;}
    .sidebar-nav a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#D4AC0D;}
    .nav-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;min-width:22px;flex-shrink:0;font-size:1rem;line-height:1;color:transparent;position:relative;overflow:hidden;}
    .nav-icon::before{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;}
    .sidebar-user{padding:16px 22px;border-top:1px solid rgba(255,255,255,.1);}
    .sidebar-user .uname{font-weight:700;font-size:.96rem;color:#fff;}
    .sidebar-user .urole{font-size:.8rem;color:rgba(255,255,255,.5);text-transform:capitalize;margin-top:4px;}
    .admin-main{flex:1;overflow-y:auto;}
    .topbar{background:#fff;padding:0 30px;height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;box-shadow:0 1px 3px rgba(0,0,0,.05);position:sticky;top:0;z-index:50;}
    .topbar-left { display: flex; align-items: center; gap: 15px; }
    .topbar-left h2{font-size:1.2rem;color:#1A4530;font-weight:800;}
    .barangay-select { padding: 9px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: .95rem; font-weight: 600; color: #1A4530; background-color: #F8FBFE; outline: none; }
    .content{padding:28px;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:.92rem;font-weight:600;border:none;cursor:pointer;text-decoration:none;transition:all .18s;font-family:inherit;}
    .btn-primary{background:#3D8C62;color:#fff;} .btn-primary:hover{background:#1A4530;}
    .btn-danger{background:#C0392B;color:#fff;} .btn-danger:hover{background:#922B21;}
    .btn-sm{padding:6px 12px;font-size:.82rem;}
    .btn-logout{background:#f0f0f0;color:#555;border:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer;font-family:inherit;}
    .two-col{display:grid;grid-template-columns:1fr 380px;gap:22px;}
    .card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid #eee;overflow:hidden;}
    .card-header{padding:14px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
    .card-header h3{font-size:1rem;color:#1A4530;font-weight:800;}
    .card-body{padding:24px;}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-weight:600;font-size:.88rem;color:#555;margin-bottom:6px;}
    .form-control{width:100%;padding:11px 13px;border:1.5px solid #ddd;border-radius:8px;font-size:.96rem;outline:none;box-sizing:border-box;font-family:inherit;transition:border-color .18s;}
    .form-control:focus{border-color:#3D8C62;box-shadow:0 0 0 3px rgba(61,140,98,.1);}
    textarea.form-control{resize:vertical;}
    .alert{padding:11px 15px;border-radius:8px;margin-bottom:14px;font-size:.92rem;}
    .alert-success{background:#EAFAF1;color:#1E8449;border:1px solid #A9DFBF;}
    .alert-danger{background:#FDEDEC;color:#C0392B;border:1px solid #F5B7B1;}
    .ann-item{border-left:4px solid #D4AC0D;padding:14px 16px;background:#FDFAF0;border-radius:0 10px 10px 0;margin-bottom:14px;transition:all .18s;}
    .ann-item:hover{background:#FEF9E7;box-shadow:0 2px 8px rgba(0,0,0,.06);}
    .ann-title{font-weight:700;color:#1A4530;font-size:1rem;margin-bottom:6px;}
    .ann-body{font-size:.95rem;color:#555;line-height:1.6;margin-bottom:8px;}
    .ann-meta{font-size:.8rem;color:#aaa;display:flex;justify-content:space-between;align-items:center;}
    .empty{text-align:center;padding:40px;color:#bbb;}
    .count-badge{background:#D6F0E6;color:#1A4530;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:20px;}
    @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
  </style>
  <link rel="stylesheet" href="../../css/admin-shell.css"/>
  <script src="../../js/public-theme.js" defer></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="admin-brand">
        <span class="admin-brand-logos" aria-hidden="true">
          <img class="admin-brand-logo" src="../../images/cLogo.jpg" alt="" />
          <img class="admin-brand-logo" src="../../images/favicon.png" alt="" />
        </span>
        <span class="admin-brand-title">
          <span class="admin-brand-kabataan">Sangguniang Kabataan</span>
          <span class="admin-brand-rule"></span>
          <span class="admin-brand-text">MUNICIPALITY OF CATIGBIAN</span>
        </span>
      </div>
      <p>Barangay Bagtic Admin</p>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a href="dashboard.html" data-role="chairperson,admin"><span class="nav-icon" aria-hidden="true"></span><span>Dashboard</span></a>
      <a href="documents.html" data-role="chairperson,admin,treasurer,secretary,councilor"><span class="nav-icon" aria-hidden="true"></span><span>Documents</span></a>
      <a href="upload.html" data-role="chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Upload</span></a>
      <a href="transparency.html" data-role="chairperson,admin,treasurer,secretary,councilor"><span class="nav-icon" aria-hidden="true"></span><span>Fund Proofs</span></a>
      <a href="announcements.html" class="active" data-role="chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Announcements</span></a>
      <a href="users.html" data-role="admin"><span class="nav-icon" aria-hidden="true"></span><span>Users</span></a>
      <a href="activity-log.html" data-role="admin,chairperson"><span class="nav-icon" aria-hidden="true"></span><span>Activity Log</span></a>
      <a href="/" class="sidebar-public-link" style="margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;"><span class="nav-icon" aria-hidden="true"></span><span>Public Site</span></a>
    </nav>
    <div class="sidebar-user"><div class="uname" id="sName">...</div><div class="urole" id="sRole"></div></div>
  </aside>

  <div class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <h2>Announcements</h2>
        <select id="barangaySelector" class="barangay-select"></select>
      </div>
      <button class="btn-logout" onclick="doLogout()">Log Out</button>
    </div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="two-col" id="announcementLayout">
        <div class="card">
          <div class="card-header">
            <h3>Posted Announcements</h3>
            <span class="count-badge" id="annCount">0</span>
          </div>
          <div class="card-body" id="annList">
            <div class="empty">Loading...</div>
          </div>
        </div>

        <div style="align-self:start;display:none;" id="announcementFormPanel">
          <div class="card">
            <div class="card-header"><h3>Post New Announcement</h3></div>
            <div class="card-body">
              <div class="form-group">
                <label class="form-label">Title <span style="color:#e74c3c;">*</span></label>
                <input type="text" class="form-control" id="annTitle" placeholder="e.g. SK General Assembly - March 2024"/>
              </div>
              <div class="form-group">
                <label class="form-label">Message <span style="color:#e74c3c;">*</span></label>
                <textarea class="form-control" id="annBody" rows="6" placeholder="Write your announcement here..."></textarea>
              </div>
              <button class="btn btn-primary" id="postBtn" onclick="postAnn()" style="width:100%;justify-content:center;">
                Post Announcement
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/barangay-context.js"></script>
<script>
  var API = window.location.origin + '/api';
  var currentUser = null;

  function fmt(d){ if(!d)return'-'; return new Date(d).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function escapeHtml(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function showAlert(msg,type){ var e=document.getElementById('alertBox'); e.innerHTML='<div class="alert alert-'+type+'">'+escapeHtml(msg)+'</div>'; if(type==='success')setTimeout(function(){e.innerHTML='';},4000); }
  function selectedBarangayId(){
    return window.SkBarangay.getSelectedBarangayId();
  }
  function selectedCreateBarangayId(){
    var id=selectedBarangayId();
    return id && id !== 'all' ? id : null;
  }
  function barangayQuery(id){
    return currentUser && currentUser.role === 'admin' && id ? '?barangay_id=' + encodeURIComponent(id) : '';
  }

  window.addEventListener('load', async function(){
    var r=await fetch(API+'/auth/me',{credentials:'include'});
    var d=await r.json();
    if(!d.success){window.location.href='/pages/login';return;}
    currentUser = d.user;
    if(currentUser.role !== 'chairperson'){
      window.location.href='dashboard';
      return;
    }
    document.getElementById('sName').textContent=d.user.name;
    document.getElementById('sRole').textContent=d.user.role;

    await window.SkBarangay.init(currentUser);
    window.SkBarangay.populateDropdown(document.getElementById('barangaySelector'));
    if (currentUser.role === 'admin') {
      document.getElementById('barangaySelector').addEventListener('change', function() {
        window.SkBarangay.setSelectedBarangayId(this.value);
        loadAnn();
      });
    }

    applyRoleVisibility();
    applyAnnouncementAccess();
    loadAnn();
  });

  function applyAnnouncementAccess(){
    var layout=document.getElementById('announcementLayout');
    var formPanel=document.getElementById('announcementFormPanel');
    if(currentUser && currentUser.role === 'chairperson'){
      if(formPanel) formPanel.style.display='block';
      if(layout) layout.style.gridTemplateColumns='1fr 380px';
    } else {
      if(formPanel) formPanel.style.display='none';
      if(layout) layout.style.gridTemplateColumns='1fr';
    }
  }

  async function loadAnn(){
    var qs = barangayQuery(selectedBarangayId());
    var r=await fetch(API+'/admin/announcements' + qs, {credentials:'include'});
    var d=await r.json();
    var container=document.getElementById('annList');
    if(!d.success||!d.data.length){
      var emptyText = currentUser && currentUser.role === 'chairperson'
        ? 'No announcements yet.<br><small>Post one using the form.</small>'
        : 'No announcements yet.';
      container.innerHTML='<div class="empty">'+emptyText+'</div>';
      document.getElementById('annCount').textContent='0';
      return;
    }
    document.getElementById('annCount').textContent=d.data.length;
    container.innerHTML=d.data.map(function(a){
      var meta=(a.barangay_name ? a.barangay_name+' - ' : '')+(a.created_by_name || 'Unknown')+' - '+fmt(a.created_at);
      return '<div class="ann-item" id="ann-'+a.id+'">'
        +'<div class="ann-title">'+escapeHtml(a.title)+'</div>'
        +'<div class="ann-body">'+escapeHtml(a.body)+'</div>'
        +'<div class="ann-meta">'
          +'<span>'+escapeHtml(meta)+'</span>'
          +'<button class="btn btn-danger btn-sm" onclick="deleteAnn('+a.id+',\''+a.barangay_id+'\')">Delete</button>'
        +'</div>'
      +'</div>';
    }).join('');
  }

  async function postAnn(){
    if(currentUser.role !== 'chairperson'){showAlert('Only SK Chairperson can post announcements.','danger');return;}
    var title=document.getElementById('annTitle').value.trim();
    var body=document.getElementById('annBody').value.trim();
    var barangayId=selectedCreateBarangayId();
    if(!title||!body){showAlert('Title and message are required.','danger');return;}
    if(currentUser.role === 'admin' && !barangayId){showAlert('Please select a barangay before posting an announcement.','danger');return;}
    var btn=document.getElementById('postBtn');
    btn.disabled=true; btn.textContent='Posting...';
    var r=await fetch(API+'/admin/announcements',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        title:title,
        body:body,
        barangay_id: barangayId
      })
    });
    var d=await r.json();
    btn.disabled=false; btn.textContent='Post Announcement';
    if(r.ok&&d.success){
      showAlert('Announcement posted successfully!','success');
      document.getElementById('annTitle').value='';
      document.getElementById('annBody').value='';
      loadAnn();
    } else { showAlert(d.message||'Failed to post.','danger'); }
  }

  async function deleteAnn(id, barangayId){
    if(!confirm('Delete this announcement?'))return;
    var r=await fetch(API+'/admin/announcements/'+id+barangayQuery(barangayId || selectedBarangayId()),{method:'DELETE',credentials:'include'});
    var d=await r.json();
    if(r.ok&&d.success){
      document.getElementById('ann-'+id)?.remove();
      showAlert('Announcement deleted.','success');
      var remaining=document.querySelectorAll('[id^="ann-"]').length;
      document.getElementById('annCount').textContent=remaining;
      if(!remaining) document.getElementById('annList').innerHTML='<div class="empty">No announcements yet.</div>';
    } else { showAlert(d.message||'Failed.','danger'); }
  }

  async function doLogout(){
    if(!confirm('Are you sure you want to log out?'))return;
    await fetch(API+'/auth/logout',{method:'POST',credentials:'include'});
    window.location.href='/';
  }

  function applyRoleVisibility() {
    var role = currentUser?.role;
    if (!role) return;
    var links = document.querySelectorAll('#sidebarNav a[data-role]');
    links.forEach(function(link) {
      var allowed = link.getAttribute('data-role').split(',');
      if (!allowed.includes(role)) {
        link.style.display = 'none';
      }
    });
    updateSidebarLinks(role);
  }
  function updateSidebarLinks(role) {
    var links = document.querySelectorAll('#sidebarNav a[data-role]');
    links.forEach(function(link) {
      var span = link.querySelector('span:last-child');
      if (!span) return;
      var href = link.getAttribute('href');
      if (role === 'chairperson') {
        if (href === 'upload.html') link.style.display = 'none';
        if (href === 'documents.html') span.textContent = 'My Documents';
        if (href === 'transparency.html') span.textContent = 'My Accomplishments';
        if (href === 'announcements.html') span.textContent = 'Post Announcements';
      } else if (role === 'admin') {
        if (href === 'documents.html') span.textContent = 'Manage Documents';
        if (href === 'transparency.html') span.textContent = 'Manage Accomplishments';
        if (href === 'upload.html') link.style.display = 'none';
      }
    });
  }
</script>
</body>
</html>
